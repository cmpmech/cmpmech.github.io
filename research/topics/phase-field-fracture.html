<section class="topic">
  <h3>Phase-field fracture</h3>
  <p>Phase-field models describe discrete cracks as a narrow band of damage.
  <a href="https://gitlab.com/hpfem/code/mlhp">mlhp</a> supports the most common phase-field fracture models with
  adaptive refinement, as well as GPU acceleration to limit computational effort.</p>

             width="720" height="720" autoplay muted loop playsinline preload="metadata"
             aria-label="A crack grows from a notch in a square plate under shear; the refined mesh moves with the crack tip"></video></div>

    </figure>
